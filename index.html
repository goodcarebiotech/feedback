<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>固德生技 · 匿名意見箱</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --surface-soft: #FBFBFC;
    --line: rgba(0,0,0,0.07);
    --line-strong: rgba(0,0,0,0.12);
    --ink: #1D1D1F;
    --ink-soft: #6E6E73;
    --ink-faint: #AEAEB4;

    --blue: #0071E3;
    --blue-deep: #0058B0;
    --blue-tint: #EAF3FF;

    --orange: #FF9500;
    --orange-deep: #C96F00;
    --orange-tint: #FFF2E0;

    --green: #2FAE60;
    --green-tint: #E7F8ED;
    --red: #FF3B30;
    --red-tint: #FFEDEC;

    --r-lg: 24px;
    --r-md: 16px;
    --r-sm: 10px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
    --shadow-md: 0 10px 30px rgba(0,0,0,.06);
    --shadow-lg: 0 24px 70px rgba(0,0,0,.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang TC', 'Microsoft JhengHei', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .display { font-family: 'Manrope', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ── HERO MEDIA (replace image URLs below with your own) ── */
  .hero-media {
    position: relative;
    width: 100%;
    height: 460px;
    min-height: 380px;
    overflow: hidden;
    background: linear-gradient(135deg, #dfe6ee, #eef1f5);
  }
  .hero-media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 35%;
    display: block;
  }
  .hero-scrim {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to bottom, rgba(0,0,0,0.02) 30%, rgba(0,0,0,0.62) 100%);
  }
  .hero-caption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 40px 24px 32px;
    text-align: center;
    color: #fff;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 100px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(6px);
    font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
    margin-bottom: 18px;
  }
  .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(47,174,96,0.35); }
  .hero-caption h1 {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 10px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }
  .hero-caption p {
    font-size: 14px;
    color: rgba(255,255,255,0.88);
    max-width: 420px;
    margin: 0 auto;
    text-shadow: 0 1px 10px rgba(0,0,0,0.3);
  }
  @media (max-width: 640px) {
    .hero-media { height: 400px; }
  }

  /* ── SEGMENTED CONTROL (signature element) ── */
  .segwrap { position: sticky; top: 0; z-index: 50; background: rgba(245,245,247,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid var(--line); padding: 14px 20px; }
  .segmented {
    position: relative;
    display: grid; grid-template-columns: repeat(2, 1fr);
    max-width: 600px; margin: 0 auto;
    background: rgba(118,118,128,0.12);
    border-radius: 100px; padding: 4px;
  }
  .seg-thumb {
    position: absolute; top: 4px; left: 4px; height: calc(100% - 8px);
    width: calc(50% - 4px);
    background: var(--surface);
    border-radius: 100px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 0;
  }
  .seg-btn {
    position: relative; z-index: 1;
    border: none; background: transparent; cursor: pointer;
    padding: 9px 6px; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap; transition: color 0.3s ease;
    border-radius: 100px;
  }
  .seg-btn.active { color: var(--ink); }
  .seg-btn .sw { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ── LAYOUT ── */
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  .section { padding: 30px 20px 10px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-soft); text-transform: uppercase; }
  .section-count { font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 700; color: var(--ink-faint); }

  /* ── SUBMIT CARD ── */
  .submit-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .submit-card:focus-within { box-shadow: var(--shadow-md); border-color: var(--line-strong); }

  .cat-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 100px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .cat-pill .sw { width: 7px; height: 7px; border-radius: 50%; }

  textarea#composeText {
    width: 100%; min-height: 110px; resize: vertical;
    border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 15px; color: var(--ink);
    line-height: 1.7;
  }
  textarea#composeText::placeholder { color: var(--ink-faint); }

  .compose-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); gap: 12px; }
  .anon-note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-faint); }

  .btn {
    font-family: inherit; font-size: 14px; font-weight: 700;
    border: none; border-radius: 100px; cursor: pointer;
    padding: 11px 22px; letter-spacing: 0.01em;
    transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease, background 0.3s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.16); }
  .btn-blue { background: var(--blue); color: #fff; box-shadow: 0 6px 18px rgba(0,113,227,0.3); }
  .btn-orange { background: var(--orange); color: #fff; box-shadow: 0 6px 18px rgba(255,149,0,0.3); }
  .btn-full { width: 100%; justify-content: center; }

  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LIST ── */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .note-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 16px 18px 16px 20px;
    box-shadow: var(--shadow-sm);
    animation: rise 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .note-card::before {
    content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 4px;
  }
  .note-card.company::before { background: var(--blue); }
  .note-card.snack::before { background: var(--orange); }

  .note-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
  .note-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; letter-spacing: 0.02em; }
  .note-tag.company { background: var(--blue-tint); color: var(--blue-deep); }
  .note-tag.snack { background: var(--orange-tint); color: var(--orange-deep); }
  .note-time { font-family: 'Manrope', sans-serif; font-size: 11px; color: var(--ink-faint); font-weight: 600; flex-shrink: 0; }
  .note-body { font-size: 14.5px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }

  .note-del {
    display: none; position: absolute; top: 12px; right: 12px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--red-tint); border: 1px solid rgba(255,59,48,0.2); color: var(--red);
    align-items: center; justify-content: center; cursor: pointer;
  }
  .admin-mode .note-del { display: flex; }
  .admin-mode .note-head { padding-right: 30px; }

  /* ── EMPTY / LOCKED ── */
  .empty-state, .locked-state {
    text-align: center; padding: 46px 24px;
    background: var(--surface-soft); border: 1px dashed var(--line-strong); border-radius: var(--r-lg);
    color: var(--ink-soft);
  }
  .empty-state .icon, .locked-state .icon { margin-bottom: 12px; opacity: 0.5; }
  .empty-state .t1, .locked-state .t1 { font-weight: 700; color: var(--ink); margin-bottom: 4px; font-size: 14px; }
  .empty-state .t2, .locked-state .t2 { font-size: 13px; }

  .loading-state {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 50px 20px;
    background: var(--surface-soft); border: 1px solid var(--line); border-radius: var(--r-lg);
    color: var(--ink-soft); font-size: 13px;
  }
  .spinner.dark { border: 2px solid rgba(0,0,0,0.12); border-top-color: var(--ink-soft); }

  footer.page-footer { text-align: center; padding: 50px 20px 40px; }
  .admin-entry {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 100px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--ink-soft); font-size: 12.5px; font-weight: 600;
    cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s ease;
  }
  .admin-entry:hover { color: var(--ink); border-color: var(--line-strong); box-shadow: var(--shadow-md); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(29,29,31,0.4); backdrop-filter: blur(6px);
    z-index: 1000; display: none; align-items: flex-end; justify-content: center; padding: 0;
  }
  .modal-overlay.show { display: flex; animation: fadeBg 0.25s ease; }
  @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
    border-radius: 28px 28px 0 0; box-shadow: var(--shadow-lg);
    animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1);
    padding-bottom: 30px;
  }
  @media (min-width: 700px) {
    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 24px; max-height: 86vh; }
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }

  .modal-handle { width: 36px; height: 4px; border-radius: 100px; background: var(--line-strong); margin: 12px auto 4px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 6px; }
  .modal-title { font-size: 17px; font-weight: 800; }
  .modal-close-x { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(118,118,128,0.14); color: var(--ink-soft); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .modal-body { padding: 8px 22px 4px; }

  .login-box { padding: 30px 6px 10px; text-align: center; }
  .login-box .icon-lock { margin-bottom: 16px; color: var(--ink-faint); }
  .login-box p { color: var(--ink-soft); font-size: 13px; margin-bottom: 22px; }
  .pw-input {
    width: 100%; text-align: center; letter-spacing: 0.3em; font-size: 18px; font-weight: 700;
    padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface);
    outline: none; font-family: inherit; color: var(--ink); margin-bottom: 14px;
  }
  .pw-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-tint); }
  .err-text { color: var(--red); font-size: 12.5px; font-weight: 600; margin-top: -4px; margin-bottom: 14px; display: none; }
  .err-text.show { display: block; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 20px; }
  .stat-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 8px; text-align: center; }
  .stat-num { font-family: 'Manrope', sans-serif; font-size: 24px; font-weight: 800; }
  .stat-box.total .stat-num { color: var(--ink); }
  .stat-box.company .stat-num { color: var(--blue); }
  .stat-box.snack .stat-num { color: var(--orange); }
  .stat-label { font-size: 10.5px; color: var(--ink-faint); font-weight: 700; letter-spacing: 0.04em; margin-top: 2px; text-transform: uppercase; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 16px 18px; margin-bottom: 22px;
  }
  .toggle-text .t1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .toggle-text .t2 { font-size: 12.5px; color: var(--ink-soft); max-width: 320px; }

  .switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track { position: absolute; inset: 0; background: rgba(120,120,128,0.32); border-radius: 100px; cursor: pointer; transition: background 0.25s ease; }
  .switch-track::before { content: ''; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.25); transition: transform 0.25s cubic-bezier(0.22,1,0.36,1); }
  .switch input:checked + .switch-track { background: var(--green); }
  .switch input:checked + .switch-track::before { transform: translateX(20px); }

  .admin-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .admin-filters { display: flex; gap: 6px; }
  .chip { padding: 6px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .logout-link { display: block; text-align: center; margin-top: 22px; font-size: 12.5px; color: var(--ink-faint); background: none; border: none; cursor: pointer; font-family: inherit; text-decoration: underline; text-underline-offset: 2px; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(90px);
    background: rgba(29,29,31,0.94); color: #fff; backdrop-filter: blur(10px);
    border-radius: 100px; padding: 12px 22px; font-size: 13px; font-weight: 600;
    z-index: 1100; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    display: flex; align-items: center; gap: 8px; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  ::selection { background: var(--blue-tint); color: var(--blue-deep); }
</style>
</head>
<body>

<!-- ============================================================
     首頁圖片：把下面 <img id="heroImg" src="..."> 換成你自己的圖片網址
     手機版可用 <source media="(max-width:640px)"> 放不同裁切的圖
============================================================ -->
<div class="hero-media">
  <picture>
    <source media="(max-width: 640px)" srcset="https://cdn-general.cybassets.com/s/files/35135/theme/127586/assets/feebackm.jpg">
    <img id="heroImg" src="https://cdn-general.cybassets.com/s/files/35135/theme/127586/assets/feeback.jpg" alt="">
  </picture>
  <div class="hero-scrim"></div>
  <div class="hero-caption">
    <div class="hero-badge"><span class="dot"></span>固德生技 · 匿名意見箱</div>
    <h1 class="display">每一個想法<br>都值得被聽見</h1>
    <p>採匿名方式收集意見，不留存任何個人資訊。不論是攸關公司發展的建議，或是茶水間零食的小小期待，都歡迎和我們分享。</p>
  </div>
</div>

<div class="segwrap">
  <div class="segmented" id="segmented">
    <div class="seg-thumb" id="segThumb"></div>
    <button class="seg-btn active" data-cat="company" onclick="selectCategory('company')"><span class="sw" style="background:var(--blue)"></span>公司建議</button>
    <button class="seg-btn" data-cat="snack" onclick="selectCategory('snack')"><span class="sw" style="background:var(--orange)"></span>零食建議</button>
  </div>
</div>

<main class="wrap">

  <section class="section" id="composeSection">
    <div class="submit-card">
      <span class="cat-pill" id="composePill"><span class="sw"></span><span id="composePillText">公司建議</span></span>
      <textarea id="composeText" maxlength="500" placeholder="想說什麼都可以，我們在聽…"></textarea>
      <div class="compose-footer">
        <span class="anon-note">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M20 12c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8 8 3.6 8 8z"/></svg>
          放心，完全匿名
        </span>
        <button class="btn" id="submitBtn" onclick="submitNote()">送出留言</button>
      </div>
    </div>
  </section>

  <section class="section" id="listSection">
    <div class="section-head">
      <span class="section-title" id="listTitle">大家的留言</span>
      <span class="section-count" id="listCount"></span>
    </div>
    <div id="listContainer">
      <div class="loading-state"><span class="spinner dark"></span>正在讀取留言…</div>
    </div>
  </section>

</main>

<footer class="page-footer">
  <p style="font-size:12px; color:var(--ink-faint); margin-bottom:16px;">固德生技 用心聽見每一個聲音</p>
  <button class="admin-entry" onclick="openAdminModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    管理後台
  </button>
</footer>

<!-- ================= ADMIN MODAL ================= -->
<div class="modal-overlay" id="adminModal" onclick="closeOnBg(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <span class="modal-title" id="modalTitleText">管理後台</span>
      <button class="modal-close-x" onclick="closeAdminModal()">✕</button>
    </div>
    <div class="modal-body">

      <div id="loginView" class="login-box">
        <div class="icon-lock">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin:0 auto"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        </div>
        <p>輸入後台密碼以管理留言與公開設定</p>
        <input type="password" class="pw-input" id="adminPw" placeholder="••••••" maxlength="30" onkeydown="if(event.key==='Enter')adminLogin()">
        <div class="err-text" id="adminPwErr">密碼錯誤，請再試一次</div>
        <button class="btn btn-primary btn-full" id="adminLoginBtn" onclick="adminLogin()">登入</button>
      </div>

      <div id="dashView" style="display:none">
        <div class="stat-grid">
          <div class="stat-box total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">總留言</div></div>
          <div class="stat-box company"><div class="stat-num" id="statCompany">0</div><div class="stat-label">公司建議</div></div>
          <div class="stat-box snack"><div class="stat-num" id="statSnack">0</div><div class="stat-label">零食建議</div></div>
        </div>

        <div class="toggle-row">
          <div class="toggle-text">
            <div class="t1">公開留言列表</div>
            <div class="t2" id="toggleDesc">開啟後，大家都能在首頁看到留言清單</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="publicToggle" onchange="togglePublicView(this.checked)">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="admin-list-head">
          <span class="section-title">全部留言（僅後台可見全部）</span>
          <div class="admin-filters">
            <button class="chip active" data-f="all" onclick="setAdminFilter('all', this)">全部</button>
            <button class="chip" data-f="company" onclick="setAdminFilter('company', this)">公司</button>
            <button class="chip" data-f="snack" onclick="setAdminFilter('snack', this)">零食</button>
          </div>
        </div>
        <div id="adminListContainer" class="list"></div>

        <button class="logout-link" onclick="adminLogout()">登出後台</button>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — 把這裡換成你部署 Apps Script 後拿到的網址
   ============================================================ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxZAD0lR6C_5O-_idmM2tpTKo5lVmc16t0u3JkEU9sM3Q0CEZ4XRclekUE1lEtaRanR/exec";

const CATEGORY_META = {
  company: { label: "公司建議" },
  snack:   { label: "零食建議" }
};

let currentCategory = "company";
let suggestions = [];
let publicView = true;
let isAdmin = false;
let adminPasswordCache = "";
let adminFilter = "all";

/* ============================================================
   API HELPER
   ============================================================ */
async function callApi(payload) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
  return res.json();
}

/* ============================================================
   UTIL
   ============================================================ */
function showToast(msg, duration = 2600) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function relTime(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '剛剛';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
  if (diff < 2592000) return Math.floor(diff / 86400) + ' 天前';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ============================================================
   SEGMENTED CONTROL
   ============================================================ */
function selectCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));

  const idx = ['company', 'snack'].indexOf(cat);
  document.getElementById('segThumb').style.transform = `translateX(${idx * 100}%)`;

  const pill = document.getElementById('composePill');
  const pillText = document.getElementById('composePillText');
  const submitBtn = document.getElementById('submitBtn');
  const listTitle = document.getElementById('listTitle');

  const meta = CATEGORY_META[cat];
  pillText.textContent = meta.label;
  pill.style.background = cat === 'company' ? 'var(--blue-tint)' : 'var(--orange-tint)';
  pill.style.color = cat === 'company' ? 'var(--blue-deep)' : 'var(--orange-deep)';
  pill.querySelector('.sw').style.background = cat === 'company' ? 'var(--blue)' : 'var(--orange)';
  submitBtn.className = 'btn ' + (cat === 'company' ? 'btn-blue' : 'btn-orange');
  listTitle.textContent = meta.label + '留言';

  renderList();
}

/* ============================================================
   SUBMIT
   ============================================================ */
async function submitNote() {
  const textEl = document.getElementById('composeText');
  const text = textEl.value.trim();
  if (!text) { showToast('請先輸入內容再送出'); return; }

  const btn = document.getElementById('submitBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> 送出中`;

  try {
    const res = await callApi({ action: 'submit', category: currentCategory, content: text });
    if (res.status === 'success') {
      textEl.value = '';
      showToast('✅ 已經收到，謝謝你願意說出來');
      // 直接把留言加到畫面上，不用再等一次伺服器回應
      suggestions.unshift({ id: 'local-' + Date.now(), category: currentCategory, content: text, createdAt: new Date().toISOString() });
      renderList();
    } else {
      showToast('⚠️ 送出失敗：' + (res.message || '請稍後再試'));
    }
  } catch (err) {
    showToast('⚠️ 連線失敗，請檢查網路');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ============================================================
   PUBLIC LIST
   ============================================================ */
async function loadList() {
  try {
    const res = await callApi({ action: 'list' });
    if (res.status === 'success') {
      suggestions = res.data || [];
      publicView = !!res.publicView;
    }
  } catch (err) {
    showToast('⚠️ 讀取留言失敗');
  }
  renderList();
}

function renderList() {
  const listSection = document.getElementById('listSection');
  const container = document.getElementById('listContainer');
  const countEl = document.getElementById('listCount');

  if (!publicView) {
    listSection.style.display = 'none';
    return;
  }
  listSection.style.display = '';

  const filtered = suggestions.filter(s => s.category === currentCategory);
  countEl.textContent = filtered.length ? filtered.length + ' 則' : '';

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin:0 auto"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
        <div class="t1">這裡還很安靜</div>
        <div class="t2">第一則留言，就從你開始</div>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(s => `
    <div class="note-card ${s.category}">
      <div class="note-head">
        <span class="note-tag ${s.category}">${CATEGORY_META[s.category] ? CATEGORY_META[s.category].label : s.category}</span>
        <span class="note-time">${relTime(s.createdAt)}</span>
      </div>
      <div class="note-body">${esc(s.content)}</div>
    </div>
  `).join('');
}

/* ============================================================
   ADMIN MODAL
   ============================================================ */
function openAdminModal() {
  document.getElementById('adminModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  if (isAdmin) showDash(); else showLogin();
}
function closeAdminModal() {
  document.getElementById('adminModal').classList.remove('show');
  document.body.style.overflow = '';
}
function closeOnBg(e) { if (e.target.id === 'adminModal') closeAdminModal(); }

function showLogin() {
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('dashView').style.display = 'none';
  document.getElementById('modalTitleText').textContent = '管理後台登入';
  document.getElementById('adminPw').value = '';
  document.getElementById('adminPwErr').classList.remove('show');
}

async function showDash() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
  document.getElementById('modalTitleText').textContent = '管理後台';
  await loadAdminData();
}

async function adminLogin() {
  const pw = document.getElementById('adminPw').value;
  if (!pw) return;
  const btn = document.getElementById('adminLoginBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> 登入中`;

  try {
    const res = await callApi({ action: 'adminLogin', password: pw });
    if (res.status === 'success') {
      adminPasswordCache = pw;
      isAdmin = true;
      document.body.classList.add('admin-mode');
      await showDash();
    } else {
      document.getElementById('adminPwErr').classList.add('show');
    }
  } catch (err) {
    showToast('⚠️ 連線失敗，請檢查網路');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '登入';
  }
}

function adminLogout() {
  isAdmin = false;
  adminPasswordCache = "";
  document.body.classList.remove('admin-mode');
  showLogin();
}

async function loadAdminData() {
  document.getElementById('adminListContainer').innerHTML = `<div class="loading-state"><span class="spinner dark"></span>正在讀取留言…</div>`;
  try {
    const res = await callApi({ action: 'adminList', password: adminPasswordCache });
    if (res.status === 'success') {
      suggestions = res.data || [];
      publicView = !!res.publicView;
      document.getElementById('publicToggle').checked = publicView;
      updateToggleDesc();
      renderAdminStats();
      renderAdminList();
    } else {
      showToast('⚠️ 讀取失敗，請重新登入');
      adminLogout();
    }
  } catch (err) {
    showToast('⚠️ 連線失敗');
  }
}

function renderAdminStats() {
  document.getElementById('statTotal').textContent = suggestions.length;
  document.getElementById('statCompany').textContent = suggestions.filter(s => s.category === 'company').length;
  document.getElementById('statSnack').textContent = suggestions.filter(s => s.category === 'snack').length;
}

function updateToggleDesc() {
  document.getElementById('toggleDesc').textContent = publicView
    ? '目前大家都能在首頁看到留言清單'
    : '目前首頁只會顯示投稿表單，留言清單暫時隱藏，只有後台看得到';
}

async function togglePublicView(checked) {
  const prevChecked = document.getElementById('publicToggle');
  try {
    const res = await callApi({ action: 'toggleSettings', password: adminPasswordCache, publicView: checked });
    if (res.status === 'success') {
      publicView = checked;
      updateToggleDesc();
      showToast(checked ? '✅ 已開放所有人查看留言' : '✅ 已將留言清單設為僅後台可見');
    } else {
      prevChecked.checked = !checked;
      showToast('⚠️ 設定失敗');
    }
  } catch (err) {
    prevChecked.checked = !checked;
    showToast('⚠️ 連線失敗');
  }
}

function setAdminFilter(f, btn) {
  adminFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderAdminList();
}

function renderAdminList() {
  const container = document.getElementById('adminListContainer');
  const filtered = adminFilter === 'all' ? suggestions : suggestions.filter(s => s.category === adminFilter);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="t1">沒有符合的留言</div></div>`;
    return;
  }

  container.innerHTML = filtered.map(s => `
    <div class="note-card ${s.category}">
      <button class="note-del" onclick="deleteNote('${s.id}')" aria-label="刪除留言">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
      </button>
      <div class="note-head">
        <span class="note-tag ${s.category}">${CATEGORY_META[s.category] ? CATEGORY_META[s.category].label : s.category}</span>
        <span class="note-time">${relTime(s.createdAt)}</span>
      </div>
      <div class="note-body">${esc(s.content)}</div>
    </div>
  `).join('');
}

async function deleteNote(id) {
  try {
    const res = await callApi({ action: 'deleteNote', password: adminPasswordCache, id: id });
    if (res.status === 'success') {
      showToast('🗑️ 留言已刪除');
      await loadAdminData();
    } else {
      showToast('⚠️ 刪除失敗');
    }
  } catch (err) {
    showToast('⚠️ 連線失敗');
  }
}

/* ============================================================
   INIT
   ============================================================ */
document.body.classList.remove('admin-mode');
selectCategory('company');
loadList();
</script>
</body>
</html>
